name: ci

on:
  push:
    branches:
      - develop
    tags:
      - '**' # Push events to every tag including hierarchical tags like v1.0/beta

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build the container image
        uses: docker/build-push-action@v6
        with:
          context: image
          pull: false
          push: false
          tags: localhost.lo/docker-dnsmasq:develop
          labels: ${{ steps.meta.outputs.labels }}

      - name: Test the container image
        run: |
          docker compose -f compose.yaml -f compose.ci.yaml up -d
          dig myhost.company @127.0.0.1 | grep -w 'myhost.company.		0	IN	A	10.0.0.2'

      - name: Push the container image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: image
          pull: false
          push: true
          cache-from: |
            type=registry,ref=localhost.lo/docker-dnsmasq:develop
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
